<!DOCTYPE html>
<html>
<head>
    <title>Product Catalog</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            border: 1px solid #ccc;
            margin: 15px;
            padding: 15px;
            width: 200px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ddd;
        }

        img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        button {
            padding: 10px 20px;
            margin: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h2>Product Catalog</h2>

<button onclick="loadProducts()">Load Products</button>

<div class="container" id="output"></div>

<script>
function loadProducts() {

    fetch("/api/products")   // ✅ same origin → no CORS
    .then(res => res.json())
    .then(data => {

        let result = "";

        data.forEach(product => {
            result += `
                <div class="card">
                    <img src="${product.image}" alt="product">
                    <h3>${product.name}</h3>
                    <p>${product.price}</p>
                </div>
            `;
        });

        document.getElementById("output").innerHTML = result;
    })
    .catch(err => {
        document.getElementById("output").innerHTML = "Error loading products";
    });
}
</script>

</body>
</html>
