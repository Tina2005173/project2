<!DOCTYPE html>
<html>
<head>
    <title>User Data</title>
    <style>
        body { font-family: Arial; text-align: center; }
        table {
            margin: auto;
            border-collapse: collapse;
            width: 90%;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
        }
        th {
            background-color: #333;
            color: white;
        }
    </style>
</head>

<body>

<h2>Registered Users</h2>

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Mobile</th>
            <th>DOB</th>
            <th>City</th>
            <th>Address</th>
            <th>Username</th>
        </tr>
    </thead>

    <tbody id="tableBody"></tbody>
</table>

<script>

let users = JSON.parse(localStorage.getItem("users")) || [];

let tbody = document.getElementById("tableBody");

users.forEach(u => {
    tbody.innerHTML += `
        <tr>
            <td>${u.name}</td>
            <td>${u.email}</td>
            <td>${u.mobile}</td>
            <td>${u.dob}</td>
            <td>${u.city}</td>
            <td>${u.address}</td>
            <td>${u.username}</td>
        </tr>
    `;
});

</script>

</body>
</html>
