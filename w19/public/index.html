<!DOCTYPE html>
<html>
<head>
    <title>Student App</title>
</head>

<body>

<h2>Student Management</h2>

<button onclick="insertData()">Insert Data</button>
<button onclick="loadStudents()">View All</button>

<br><br>

<input id="name" placeholder="Name">
<button onclick="updateMarks()">+10 Marks</button>

<input id="del" placeholder="Delete Name">
<button onclick="deleteStudent()">Delete</button>

<br><br>

<button onclick="dsbda20()">DSBDA > 20</button>
<button onclick="above25()">>25 All</button>
<button onclick="less40()"><40 WAD & CNS</button>

<h3 id="count"></h3>

<table border="1">
<thead>
<tr>
<th>Name</th><th>Roll</th><th>WAD</th><th>DSBDA</th>
<th>CNS</th><th>CC</th><th>AI</th>
</tr>
</thead>
<tbody id="data"></tbody>
</table>

<script>

function insertData(){
    fetch('/insert')
    .then(res=>res.text())
    .then(msg=>alert(msg));
}

function loadStudents(){
    fetch('/students')
    .then(res=>res.json())
    .then(result=>{
        document.getElementById("count").innerText="Total: "+result.count;
        display(result.data);
    });
}

function display(data){
    let html="";
    data.forEach(s=>{
        html+=`
        <tr>
        <td>${s.Name}</td>
        <td>${s.Roll_No}</td>
        <td>${s.WAD_Marks}</td>
        <td>${s.DSBDA_Marks}</td>
        <td>${s.CNS_Marks}</td>
        <td>${s.CC_Marks}</td>
        <td>${s.AI_Marks}</td>
        </tr>`;
    });
    document.getElementById("data").innerHTML=html;
}

function dsbda20(){
    fetch('/students/dsbda20')
    .then(res=>res.json())
    .then(data=>display(data));
}

function above25(){
    fetch('/students/above25')
    .then(res=>res.json())
    .then(data=>display(data));
}

function less40(){
    fetch('/students/less40')
    .then(res=>res.json())
    .then(data=>display(data));
}

function updateMarks(){
    let name=document.getElementById("name").value;

    fetch('/students/'+name,{
        method:'PUT'
    })
    .then(res=>res.text())
    .then(msg=>alert(msg));
}

function deleteStudent(){
    let name=document.getElementById("del").value;

    fetch('/students/'+name,{
        method:'DELETE'
    })
    .then(res=>res.text())
    .then(msg=>{
        alert(msg);
        loadStudents();
    });
}

</script>

</body>
</html>
