<html>
    <body>
        <button onclick="loadData()"> Get Data </button>
        <br>
        <div id="result"></div>

        <script>
            function loadData()
            {
                fetch("http://localhost:3000/api")
                .then(res=>res.json())
                .then(data=>
                    {
                        let html = "";
                        data.forEach(user=>
                            {
                                html+=`
                                    <p>${user.name}  -  ${user.email}</p>
                                
                                `;
                            }
                        );

                        document.getElementById("result").innerHTML=html;
                    }
                ).catch(()=>{
                    document.getElementById("result").innerHTML="Error loading data !";
                });
            }
        </script>

    </body>
</html>
