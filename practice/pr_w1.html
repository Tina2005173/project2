<html>
<head>
    <title> practice2 w1
    </title>
    <style>

        body{
         
            background-color:rgb(243, 239, 235);
            text-align:center;
        }

        table{
            
            border-collapse: collapse;
            margin :auto;
            width:80%;
        }

        th,td{
            border:1px solid black;
            padding:10px;
        }

        img{
            width:60px;
            height:60px;
        }
        button{
            padding : 10px;
            margin :5px;
            background-color: aquamarine;
        }
        .pagination{
            margin:20px;
        }


    </style>
</head>

    <body>
        <table>
             <thead>
                <tr>
                
                    <th>image</th>
                    <th>name</th>
                    <th>price</th>
                    <th>description</th>
                
                </tr>
            </thead>

            <tbody id="tablebody"></tbody>

        </table>
        <div id="pagination">
            <button onclick="prev()">prev</button>
            <span id="numbering"></span>
            <button onclick="next()"> next</button>
        </div>


        <script>
            const product =[
                {name:"headphones",price:10000,description:"headphones",img:"one.jpg"},
                {name:"headphones",price:10000,description:"headphones",img:"one.jpg"},
                {name:"headphones",price:10000,description:"headphones",img:"one.jpg"},
                {name:"headphones",price:10000,description:"headphones",img:"one.jpg"},
                {name:"headphones",price:10000,description:"headphones",img:"one.jpg"},
                {name:"headphones",price:10000,description:"headphones",img:"one.jpg"},
                {name:"headphones",price:10000,description:"headphones",img:"one.jpg"},
                {name:"headphones",price:10000,description:"headphones",img:"one.jpg"},
                {name:"headphones",price:10000,description:"headphones",img:"one.jpg"},
                {name:"headphones",price:10000,description:"headphones",img:"one.jpg"},
                {name:"headphones",price:10000,description:"headphones",img:"one.jpg"},
                {name:"headphones",price:10000,description:"headphones",img:"one.jpg"},
                {name:"headphones",price:10000,description:"headphones",img:"one.jpg"},
                {name:"headphones",price:10000,description:"headphones",img:"one.jpg"},
            ];

            let currentpage = 1;
            const totpage=5;

            function getinfo()
            {
                const tablebody = document.getElementById("tablebody");
                tablebody.innerHTML="";

                const start = (currentpage - 1) * totpage ;
                const end = start+totpage;
                const page = product.slice(start,end);

                page.forEach(p => {
                    let row = `<tr>
                            <td><img src = ${p.img}></td>
                            <td>${p.name}</td>
                            <td>₹${p.price}</td>
                            <td>${p.description}</td>
                        </tr>`;

                        tablebody.innerHTML+=row;
                });

                document.getElementById("numbering").innerHTML = 
                "   page "+ currentpage +"  of  "+ Math.ceil(product.length/totpage);

            }

            function prev()
            {
                if(currentpage > 1)
                {
                    currentpage--;
                    getinfo();
                }
            }

            function next()
            {
                if(currentpage < Math.ceil(product.length/totpage))
                {
                    currentpage++;
                    getinfo();
                }

            }

            getinfo();

        </script>

    </body>
</html>
