<html>
    <body>
        <button onclick="insertrow()">insertrow</button>
        <button onclick="loaddata()">loaddata</button>
        <button onclick="display()">display</button>
        <button onclick="deletesong()">deletesong</button>
        <button onclick="updatesong()">updatesong</button>
        <button onclick="updateOther()">updateOther</button>
        <button onclick="add1()">add</button>
        <table>
        <thead>
            <tr>
                <th>Song</th>
                <th>Film</th>
                <th>Director</th>
                <th>Singer</th>
                
            </tr>
        </thead>
         <tbody id="data"></tbody>
        </table>
        <script>
            function insertrow()
            {
                fetch('/insert')
                .then(res=>res.text())
                .then(msg=>alert(msg));
            }

            function loaddata()
            {
                document.getElementById("data").innerHTML="<tr><td>Loading...</td></tr>";
                fetch('/song')
                .then(res=>res.json())
                .then(data=>display(data));
            }

            function display(data)
            {
                let html ="";
                if(data.length === 0)
                {
                    html=`<tr><td>no row</td></tr>`;
                }
                else
                {
                    data.forEach(p=>{
                        html+= 
                        `<tr><td>${p.songname}</td>
                            <td>${p.film}</td>
                            <td>${p.music_director}</td>
                            <td>${p.singer}</td>
                            </tr>`;
                    });
                }
                document.getElementById("data").innerHTML=html;           
            }

            function deletesong()
            {
                let song ="song2";
                fetch('/songs/'+encodeURIComponent(song),{
                    method:'DELETE'
                })
                .then(res=>res.text())
                .then(msg=>{alert(msg);
                 loaddata();}
                );
            }

            function updatesong()
            {
                let song = "song1";
                fetch('/songs/'+encodeURIComponent(song),{
                    method:'PUT',
                    headers : {"Content-Type":"application/json"},
                    body:JSON.stringify({
                        film:"MNO",
                        singer:"PQR"
                    })
                })
                .then(res=>res.text())
                .then(msg=>{
                    alert(msg);
                    loaddata();
                });
            }

            function updateOther()
            {
                let song="song1";
                let film="vvv";
                let singer="bbbb";

                fetch('/update-actor/'+encodeURIComponent(song),{
                    method:'PUT',
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({
                        film:film,
                        singer:singer
                    })
                })
                .then(res=>res.text())
                .then(msg=>{
                    alert(msg);
                    loaddata();
                })
            }

            function add1()
            {
                let song ="eeee";
                let singer="eeee";
                let flim ="eeee";
                let music_director="eeee";

                fetch('/add',{
                    method:'POST',
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({
                        songname:song,
                        film:flim,
                        music_director:music_director,
                        singer:singer
                    })
                })
                .then(res=>res.text())
                .then(msg=>{
                    alert(msg);
                    loaddata();
                })
            }

        </script>
    </body>
</html>
