<html>

<head>
    <style>

        body{
            background-color: rgb(231, 230, 229);
            text-align:center;
            margin :0;
        }

        .box{
            border-radius: 10px;
            background-color: white;
            margin:auto;
            padding:20px;
            width:300px;
            margin-top:50px;
        }

        input ,button{
            padding:10px;
            margin:20px;
            width:80%;
        }

        #result{
            margin-top:20px;
        }

        </style>
</head>
    <body>
        <div class ="box">
            <input type="text" id ="city" placeholder="enter city name "><br>
            <button onclick="getweather()"> Get Weather</button>

            <div id ="result"></div>

        </div>

        <script>
            function getweather()
            {
                let city = document.getElementById("city").value.toLowerCase();
                document.getElementById("result").innerHTML="Loading...";

                let xhr = new XMLHttpRequest();
                xhr.open("GET" , "data_w9.json", true);

                xhr.onreadystatechange = function (){

                    if(xhr.readyState===4)
                    {
                        if(xhr.status === 200)
                        {
                            let weather = JSON.parse(xhr.responseText);
                            if(weather[city])
                            {
                                let data = weather[city];

                                document.getElementById("result").innerHTML=`
                                <h3>${city.toUpperCase()}</h3>
                                <p>Temperature : ${data.temp} </p>
                                <p>Humidity: ${data.humidity}%</p>
                                <p>Condition: ${data.condition}</p>
                                `;
                            }
                            else{
                                 document.getElementById("result").innerHTML="city not found ";
                            }
                        }
                        else
                        {
                            document.getElementById("result").innerHTML="Error in loading data";
                        }
                    }
                } 
                xhr.send();
            }

            
        </script>

    </body>

</html>
